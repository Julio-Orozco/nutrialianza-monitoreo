limit_req_zone $binary_remote_addr zone=stress_limit:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /health {
        return 200 "NutriAlianza OK\n";
        add_header Content-Type text/plain;
    }

    # Métricas internas de Nginx
    location = /stub_status {
        stub_status;
        access_log off;
    }

    # Endpoint exclusivo para el escenario de saturación HTTP
    location = /stress {
        limit_req zone=stress_limit burst=10 nodelay;
        limit_req_status 503;

        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}
