services:
  nginx:
    image: nginx:latest
    container_name: nutrialianza-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - mysql
    networks:
      - nutrialianza-net

  mysql:
    image: mysql:8.0
    container_name: nutrialianza-mysql
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - nutrialianza-net

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: nutrialianza-mysqld-exporter
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    ports:
      - "9104:9104"
    depends_on:
      - mysql
    networks:
      - nutrialianza-net

  prometheus:
    image: prom/prometheus:latest
    container_name: nutrialianza-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - nutrialianza-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: nutrialianza-node-exporter
    ports:
      - "9100:9100"
    networks:
      - nutrialianza-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: nutrialianza-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - nutrialianza-net


  loki:
    image: grafana/loki:2.9.8
    container_name: nutrialianza-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yml:ro
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - nutrialianza-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: nutrialianza-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/nginx:/var/log/nginx:ro
    command: filebeat -e --strict.perms=false
    depends_on:
      - nginx
      - loki
    networks:
      - nutrialianza-net

  n8n:
    image: n8nio/n8n:latest
    container_name: nutrialianza-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - prometheus
      - loki
    networks:
      - nutrialianza-net

  grafana:

    image: grafana/grafana-oss:latest
    container_name: nutrialianza-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus
      - loki

    networks:
      - nutrialianza-net


volumes:
  mysql_data:
  n8n_data:
  grafana_data:

networks:
  nutrialianza-net:
    driver: bridge
